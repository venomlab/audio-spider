[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "audio-spider"
version = "0.1.0"
description = "GTK3 flow-graph editor for PulseAudio: combine speakers into groups and route inputs to outputs visually"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click>=8.3",
  "pygobject>=3.42,<3.52",
  # pulsectl is vendored under audio_spider/_vendor/pulsectl/ — see its
  # LICENSE there. Bundled because python3-pulsectl is not in Ubuntu 22.04
  # repositories.
]

scripts.audio-spider = "audio_spider.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = [ "audio_spider" ]

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4
extend-exclude = [ "audio_spider/_vendor" ]
output-format = "concise"
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
# Enable FBT (boolean trap), TD (todos), FIX (fixme), PTH (pathlib)
lint.extend-ignore = [
  "ANN401",
  "ARG",
  "COM",
  "D",
  "E501",
  "FBT",
  "FIX",
  "PERF203", # try/except in loop is fine on 3.11+; we still target 3.10
  "PL",
  "PT011",
  "PTH",
  "RUF012",
  "SIM102",
  "SIM108",
  "SIM114",
  "SLF",
  "TD",
  "TRY301",
]
lint.extend-per-file-ignores."tests/*" = [ "C90", "DTZ", "FBT", "S101", "S105", "S608", "TID" ]
lint.extend-fixable = [ "F401", "G" ]
lint.extend-safe-fixes = [ "ANN204" ]
lint.mccabe.max-complexity = 14

[tool.pytest.ini_options]
markers = [
  "gtk: tests that require a working GTK display (auto-skipped without DISPLAY)",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.10"
exclude = [ "audio_spider/_vendor/" ]
# gi.repository (GTK/GooCanvas/GObject) has no type stubs — subclasses
# of ApplicationWindow/Object/CanvasGroup/etc. are unavoidably Any-based.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "audio_spider._vendor.*"
ignore_errors = true
