[project]
name = "audio-spider"
version = "0.1.0"
description = "GTK3 flow-graph editor for PulseAudio: combine speakers into groups and route inputs to outputs visually."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.0",
    "pulsectl>=23.5.0",
    "pygobject>=3.42,<3.52",
]

[project.scripts]
audio-spider = "audio_spider.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_spider"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
format.indent-style = "space"
format.quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "gtk: tests that require a working GTK display (auto-skipped without DISPLAY)",
]
